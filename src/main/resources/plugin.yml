name: NetheriteUp
version: 0.1.0
main: me.jheyvu.netheriteup.NetheriteUpPlugin
api-version: 1.21

commands:
  nup:
    description: NetheriteUp helper commands
    usage: /nup setlevel <level>
    permission: netheriteup.use

permissions:
  netheriteup.use:
    default: true
  netheriteup.setlevel:
    default: op
